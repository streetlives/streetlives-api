name: Run database migrations
description: >-
  Opens the RDS security group to this runner's IP, applies pending Sequelize
  migrations, and always closes the hole again.

inputs:
  security-group-id:
    description: Security group fronting the target RDS instance.
    required: true
  database-host:
    description: RDS endpoint hostname.
    required: true
  database-port:
    description: RDS port.
    required: false
    default: '5432'
  database-name:
    description: Database name.
    required: true
  database-user:
    description: Database user.
    required: true
  database-password:
    description: Database password.
    required: true
  config-path:
    description: >-
      Sequelize CLI config to connect with. Defaults to the checked-out tree's
      own. deploy-prod.yml overrides it so a rollback to a revision predating
      the verified-TLS settings still connects - the migrations come from the
      deployed ref, the connection settings from the workflow's own revision.
    required: false
    default: sequelize/config/database.js

runs:
  using: composite
  steps:
    # Composite-action inputs are not secrets, so mask the password explicitly
    # before it can reach any log line. Every step below passes inputs through
    # `env:` rather than interpolating them into the script: Actions substitutes
    # expressions as literal text before bash parses the line, so a value
    # containing a backtick or $(...) would otherwise break the step or execute
    # under the deployment job's credentials.
    - name: Mask credentials
      shell: bash
      env:
        DATABASE_PASSWORD: ${{ inputs.database-password }}
      run: printf '::add-mask::%s\n' "$DATABASE_PASSWORD"

    # The CLI's own connection is configured from `config-path`, which callers
    # pin to a current revision. A migration that imports src/models opens a
    # second connection from the *deployed* tree's src/config.js, and that one
    # cannot be pinned from outside - so refuse to run it rather than put the
    # production credentials on an unverified connection. Rolling back that far
    # almost never has pending migrations anyway: db:migrate only applies ones
    # the database has not seen, and an older tree has none.
    - name: Require verified TLS on every connection a migration opens
      shell: bash
      run: |
        set -euo pipefail
        if [ -f src/utils/ssl.js ]; then
          echo "Deployed tree verifies the RDS server certificate on every connection."
          exit 0
        fi

        model_backed="$(grep -rl 'src/models' sequelize/migrations 2>/dev/null || true)"
        if [ -z "$model_backed" ]; then
          echo "Revision predates verified TLS, but no migration opens a connection of its own."
          exit 0
        fi

        echo "::error::This revision predates verified TLS in src/config.js, and these migrations \
        open their own connection through it: $(echo "$model_backed" | tr '\n' ' ')Running them \
        would send the production database credentials over an unverified connection. Re-run this \
        deploy with run_migrations: false - a revision this old has no pending migrations to apply."
        exit 1

    - name: Resolve runner egress IP
      id: runner-ip
      shell: bash
      run: |
        set -euo pipefail
        ip="$(curl -fsS --retry 3 --retry-delay 2 https://checkip.amazonaws.com | tr -d '[:space:]')"
        if [[ ! "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
          echo "Could not determine runner IP (got: '$ip')" >&2
          exit 1
        fi
        echo "ip=$ip" >> "$GITHUB_OUTPUT"
        echo "Runner egress IP resolved."

    - name: Open RDS security group to this runner
      id: open-sg
      shell: bash
      env:
        SECURITY_GROUP_ID: ${{ inputs.security-group-id }}
        DATABASE_PORT: ${{ inputs.database-port }}
        RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        rule_id="$(aws ec2 authorize-security-group-ingress \
          --group-id "$SECURITY_GROUP_ID" \
          --ip-permissions "IpProtocol=tcp,FromPort=$DATABASE_PORT,ToPort=$DATABASE_PORT,IpRanges=[{CidrIp=$RUNNER_IP/32,Description='gha run $RUN_ID'}]" \
          --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
          --output text)"
        if [[ -z "$rule_id" || "$rule_id" == "None" ]]; then
          echo "Failed to create a security group rule." >&2
          exit 1
        fi
        # Recorded so the revoke step targets this exact rule and can never
        # clobber an unrelated one that happens to share the CIDR.
        echo "rule-id=$rule_id" >> "$GITHUB_OUTPUT"
        echo "Opened port $DATABASE_PORT via rule $rule_id"

    - name: Pending migrations (before)
      shell: bash
      env:
        NODE_ENV: production
        DATABASE_HOST: ${{ inputs.database-host }}
        DATABASE_PORT: ${{ inputs.database-port }}
        DATABASE_NAME: ${{ inputs.database-name }}
        DATABASE_USER: ${{ inputs.database-user }}
        DATABASE_PASSWORD: ${{ inputs.database-password }}
        DATABASE_LOGGING: 'false'
        CONFIG_PATH: ${{ inputs.config-path }}
      run: npx sequelize-cli db:migrate:status --config "$CONFIG_PATH"

    - name: Apply migrations
      shell: bash
      env:
        NODE_ENV: production
        DATABASE_HOST: ${{ inputs.database-host }}
        DATABASE_PORT: ${{ inputs.database-port }}
        DATABASE_NAME: ${{ inputs.database-name }}
        DATABASE_USER: ${{ inputs.database-user }}
        DATABASE_PASSWORD: ${{ inputs.database-password }}
        DATABASE_LOGGING: 'false'
        CONFIG_PATH: ${{ inputs.config-path }}
      run: npx sequelize-cli db:migrate --config "$CONFIG_PATH"

    - name: Migration status (after)
      if: always() && steps.open-sg.outcome == 'success'
      shell: bash
      env:
        NODE_ENV: production
        DATABASE_HOST: ${{ inputs.database-host }}
        DATABASE_PORT: ${{ inputs.database-port }}
        DATABASE_NAME: ${{ inputs.database-name }}
        DATABASE_USER: ${{ inputs.database-user }}
        DATABASE_PASSWORD: ${{ inputs.database-password }}
        DATABASE_LOGGING: 'false'
        CONFIG_PATH: ${{ inputs.config-path }}
      run: npx sequelize-cli db:migrate:status --config "$CONFIG_PATH"

    # Must be always(): a failed migration must not leave the database exposed.
    - name: Close RDS security group
      if: always() && steps.open-sg.outputs.rule-id != ''
      shell: bash
      env:
        SECURITY_GROUP_ID: ${{ inputs.security-group-id }}
        RULE_ID: ${{ steps.open-sg.outputs.rule-id }}
      run: |
        set -euo pipefail
        aws ec2 revoke-security-group-ingress \
          --group-id "$SECURITY_GROUP_ID" \
          --security-group-rule-ids "$RULE_ID" \
          --query 'Return' --output text
        echo "Revoked rule $RULE_ID"
