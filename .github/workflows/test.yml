name: Run tests


on:
 push:
   branches:
     - develop
 pull_request:


jobs:
 test:
   runs-on: ubuntu-latest


   services:
     postgres:
       image: postgis/postgis:16-3.4
       env:
         POSTGRES_USER: streetlives
         POSTGRES_PASSWORD: password
         POSTGRES_DB: test
       ports:
         - 5432:5432
       options: >-
         --health-cmd pg_isready
         --health-interval 10s
         --health-timeout 5s
         --health-retries 5


   steps:
     - uses: actions/checkout@v4


     - name: Set up Node.js
       uses: actions/setup-node@v4
       with:
         node-version: '18'
         cache: npm


     - name: Install dependencies
       run: npm ci


     - name: Run tests
       env:
         NODE_ENV: test
         DATABASE_NAME: test
         DATABASE_USER: streetlives
         DATABASE_PASSWORD: password
         DATABASE_HOST: localhost
         DATABASE_PORT: 5432
       run: npm test


